<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>샘플 입고 | 더제이수</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
:root {
  --bg: #F7F6F3; --white: #FFF; --black: #111;
  --gray-100: #F2F1EE; --gray-200: #E6E3DE; --gray-400: #B0ADA7; --gray-600: #6B6760;
  --green: #2D6A4F; --green-light: #EAF4EE;
  --blue: #1A56A0; --blue-light: #EBF2FC;
  --red: #C0392B; --red-light: #FDECEA;
  --amber: #B8860B; --amber-light: #FEF9E7;
  --accent: #E8756A;
  --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,0.07); --font: 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--black); min-height: 100vh; padding-bottom: 120px; }

header { background: var(--black); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.logo { color: white; font-size: 16px; font-weight: 700; }
.logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; }
.btn-sheet-link { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 20px; text-decoration: none; border: none; cursor: pointer; font-family: var(--font); white-space: nowrap; }
.btn-reset-top { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; font-family: var(--font); }

.main { max-width: 680px; margin: 0 auto; padding: 20px 16px; width: 100%; }

/* 섹션 */
.section { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.section-title { font-size: 13px; font-weight: 700; color: var(--gray-600); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.step-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--black); color: white; font-size: 11px; font-weight: 700; }

/* 거래처 검색 */
.search-wrap { position: relative; }
.search-input { width: 100%; border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 13px 16px; font-size: 15px; font-family: var(--font); background: var(--white); outline: none; transition: border-color 0.15s; }
.search-input:focus { border-color: var(--black); }
.search-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: white; border: 1.5px solid var(--gray-200); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.14); z-index: 300; max-height: 220px; overflow-y: auto; }
.search-item { padding: 11px 16px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--gray-100); }
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: var(--gray-100); }
.search-item-name { font-weight: 600; }
.search-item-meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }

/* 거래처 정보 카드 */
.vendor-info-card { display: none; background: var(--blue-light); border: 1.5px solid #c0d8f0; border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.vendor-info-card.show { display: block; }
.vendor-info-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.vendor-info-row { font-size: 13px; color: #1A56A0; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.vendor-info-row:last-child { margin-bottom: 0; }

/* 날짜 */
.date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.date-field { display: flex; flex-direction: column; gap: 6px; }
.date-label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
.date-input { border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 11px 12px; font-size: 14px; font-family: var(--font); background: var(--white); outline: none; width: 100%; }
.date-input:focus { border-color: var(--black); }

/* 상품 목록 (요청중) */
.product-list { display: flex; flex-direction: column; gap: 8px; }
.product-item { border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 11px 13px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.15s; background: var(--white); }
.product-item:hover { border-color: var(--gray-400); }
.product-item.selected { border-color: var(--green); background: var(--green-light); }
.product-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--gray-200); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; transition: all 0.15s; }
.product-check.on { background: var(--green); border-color: var(--green); color: white; }
.product-name { font-size: 13px; font-weight: 600; flex: 1; line-height: 1.4; }
.product-source { font-size: 11px; color: var(--gray-400); margin-left: auto; flex-shrink: 0; }

.empty-products { text-align: center; padding: 24px; color: var(--gray-400); font-size: 13px; }

/* 직접 추가 */
.add-item-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.add-item-input { flex: 1; border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 11px 13px; font-size: 14px; font-family: var(--font); background: var(--white); outline: none; }
.add-item-input:focus { border-color: var(--black); }
.btn-add-item { padding: 11px 16px; border-radius: 8px; border: none; background: var(--black); color: white; font-size: 13px; font-weight: 700; font-family: var(--font); cursor: pointer; white-space: nowrap; }

/* 직접 추가 목록 */
.manual-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.manual-item { border: 1.5px dashed var(--gray-200); border-radius: 8px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; background: var(--gray-100); }
.manual-item-name { flex: 1; font-size: 13px; }
.btn-del-manual { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 16px; padding: 2px; line-height: 1; }
.btn-del-manual:hover { color: var(--red); }

/* 선택 요약 */
.summary-bar { background: var(--green-light); border: 1.5px solid var(--green); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display: none; }
.summary-bar.show { display: block; }
.summary-text { font-size: 13px; color: var(--green); font-weight: 600; }

/* 저장 버튼 */
.save-wrap { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--gray-200); padding: 14px 16px; z-index: 50; }
.save-inner { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; }
.btn-save { flex: 1; background: var(--green); color: white; border: none; border-radius: 10px; padding: 15px; font-size: 15px; font-weight: 700; font-family: var(--font); cursor: pointer; transition: background 0.15s; }
.btn-save:disabled { background: var(--gray-400) !important; cursor: not-allowed !important; }

/* 완료 팝업 */
.popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; align-items: center; justify-content: center; }
.popup-overlay.show { display: flex; }
.popup-box { background: white; border-radius: 20px; padding: 28px 24px; width: calc(100% - 40px); max-width: 380px; text-align: center; animation: popIn 0.3s ease; }
@keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.popup-icon { font-size: 48px; margin-bottom: 12px; }
.popup-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.popup-desc { font-size: 13px; color: var(--gray-600); margin-bottom: 20px; line-height: 1.6; }
.popup-items { background: var(--gray-100); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; text-align: left; }
.popup-items-title { font-size: 11px; font-weight: 700; color: var(--gray-600); margin-bottom: 8px; }
.popup-item { font-size: 12px; color: var(--black); padding: 3px 0; border-bottom: 1px solid var(--gray-200); }
.popup-item:last-child { border-bottom: none; }
.btn-popup-close { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--green); color: white; font-size: 15px; font-weight: 700; font-family: var(--font); cursor: pointer; }

/* 로딩 */
.spinner { width: 28px; height: 28px; border: 3px solid var(--gray-200); border-top-color: var(--black); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 로딩 상태 */
.loading-products { display: flex; align-items: center; gap: 12px; padding: 20px; justify-content: center; color: var(--gray-600); font-size: 13px; }

/* 힌트 텍스트 */
.hint { font-size: 11px; color: var(--gray-400); margin-top: 6px; }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--black); color: white; padding: 10px 18px; border-radius: 24px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 400; max-width: calc(100vw - 40px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 전체선택 버튼 */
.section-title-right { margin-left: auto; }
.btn-select-all { background: none; border: 1px solid var(--gray-200); border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; font-family: var(--font); cursor: pointer; color: var(--gray-600); }
.btn-select-all:hover { background: var(--gray-100); }

@media (max-width: 480px) {
  .main { padding: 14px 12px; }
  .date-row { grid-template-columns: 1fr 1fr; }
  .save-inner { flex-direction: column; }
  input, select, textarea, button { touch-action: manipulation; }
  input[type="text"], input[type="date"] { font-size: 16px !important; }
  .search-input { font-size: 16px !important; }
  .add-item-input { font-size: 16px !important; }
}
</style>
</head>
<body>

<header>
  <div class="logo">더제이수 <span>샘플입고</span></div>
  <div class="header-right">
    <a class="btn-sheet-link" href="https://docs.google.com/spreadsheets/d/1cSF19qDVRfIAdFMGOFMbD73yajki4zUdPoEFE0vemEY/edit#gid=0" target="_blank">📋 샘플관리 시트</a>
    <button class="btn-reset-top" onclick="resetAll()">↺ 초기화</button>
  </div>
</header>

<div class="main">

  <!-- STEP 1: 거래처 검색 -->
  <div class="section">
    <div class="section-title">
      <span class="step-badge">1</span>
      거래처 검색
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="vendorSearchInput"
        placeholder="🔍 거래처명 입력 (예: 이너프, ㅇㄴㅍ)"
        oninput="onVendorInput(this.value)"
        onkeydown="if(event.key==='Escape') closeDropdown()"
        autocomplete="off">
      <div class="search-dropdown" id="vendorDropdown"></div>
    </div>
    <div class="hint">초성 검색 지원 (예: ㄷㄹㅍ → 드라이플라워)</div>

    <!-- 선택된 거래처 정보 -->
    <div class="vendor-info-card" id="vendorInfoCard">
      <div class="vendor-info-name" id="viName"></div>
      <div class="vendor-info-row">📞 <span id="viPhone"></span></div>
      <div class="vendor-info-row">📍 <span id="viAddr"></span></div>
    </div>
  </div>

  <!-- STEP 2: 날짜 설정 -->
  <div class="section">
    <div class="section-title">
      <span class="step-badge">2</span>
      날짜 설정
    </div>
    <div class="date-row">
      <div class="date-field">
        <div class="date-label">📥 입고일</div>
        <input type="date" class="date-input" id="inDate">
      </div>
      <div class="date-field">
        <div class="date-label">📤 반납기한</div>
        <input type="date" class="date-input" id="dueDate">
      </div>
    </div>
  </div>

  <!-- STEP 3: 요청중 상품 선택 -->
  <div class="section">
    <div class="section-title">
      <span class="step-badge">3</span>
      요청중 상품 선택
      <div class="section-title-right">
        <button class="btn-select-all" onclick="selectAll()" id="btnSelectAll" style="display:none;">전체선택</button>
      </div>
    </div>

    <!-- 초기 안내 -->
    <div id="productPlaceholder" style="text-align:center; padding:24px; color:var(--gray-400); font-size:13px;">
      ① 거래처를 먼저 선택해 주세요
    </div>

    <!-- 로딩 -->
    <div id="productLoading" class="loading-products" style="display:none;">
      <div class="spinner"></div>
      <span>요청중 상품 불러오는 중...</span>
    </div>

    <!-- 상품 목록 -->
    <div id="productList" class="product-list" style="display:none;"></div>

    <!-- 직접 추가 -->
    <div id="addSection" style="display:none; margin-top:14px;">
      <div style="font-size:12px; font-weight:700; color:var(--gray-600); margin-bottom:8px;">➕ 목록에 없는 상품 직접 추가</div>
      <div class="add-item-row">
        <input type="text" class="add-item-input" id="manualInput"
          placeholder="상품명 입력"
          onkeydown="if(event.key==='Enter') addManualItem()">
        <button class="btn-add-item" onclick="addManualItem()">추가</button>
      </div>
      <div class="manual-list" id="manualList"></div>
    </div>
  </div>

</div>

<!-- 저장 버튼 -->
<div class="save-wrap">
  <div class="save-inner">
    <button class="btn-save" id="btnSave" onclick="saveAll()" disabled>
      📥 입고 처리
    </button>
  </div>
</div>

<!-- 완료 팝업 -->
<div class="popup-overlay" id="successPopup">
  <div class="popup-box">
    <div class="popup-icon">🎉</div>
    <div class="popup-title">입고 완료!</div>
    <div class="popup-desc" id="popupDesc"></div>
    <div class="popup-items" id="popupItems" style="display:none;">
      <div class="popup-items-title">입고된 상품</div>
      <div id="popupItemList"></div>
    </div>
    <button class="btn-popup-close" onclick="closePopup()">확인</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var GAS_VENDOR_URL = 'https://script.google.com/macros/s/AKfycbyDdnhYVgXfr0MTOj0l_kKm6l7cQ061k6cHqtNPauhF7gYuKJWVFRcCQHij3c297b8O/exec';
var GAS_SAMPLE_URL = 'https://script.google.com/macros/s/AKfycbwfelSlPiN9AwwD5aID2ypYYjLh9B6lb2TpXHj6qXYIgNqEivojUicTGn7WzMwCChLGEQ/exec';

// ── 거래처 DB ──
var vendorDB = [];
var selectedVendor = null;   // { 업체명, 전화번호, 위치 }
var requestedItems = [];     // 해당 거래처의 요청중 상품 목록
var manualItems = [];        // 직접 추가 상품
var allSamplesCache = null;  // 전체 샘플 캐시 (로딩 최적화)

// ── 초기화 ──
window.addEventListener('load', function() {
  setDefaultDates();
  // 거래처 + 전체샘플 동시에 미리 로드 (각각 독립 실행, 한쪽 실패해도 다른쪽 영향 없음)
  loadVendors();
  preloadSamples();
});

function setDefaultDates() {
  var today = new Date();
  var due   = new Date(today);
  due.setDate(due.getDate() + 14);
  document.getElementById('inDate').value  = formatDate(today);
  document.getElementById('dueDate').value = formatDate(due);
}

function formatDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + dd;
}

// ── 전체 샘플 미리 로드 (캐시) ──
async function preloadSamples() {
  try {
    var res = await fetch(GAS_SAMPLE_URL + '?action=getAll');
    var data = await res.json();
    if (data.result === 'ok') {
      allSamplesCache = data.rows || [];
    }
  } catch(e) {
    allSamplesCache = null; // 실패 시 null 유지 → 거래처 선택 시 재시도
  }
}

// ── 거래처 로드 ──
async function loadVendors() {
  try {
    var res = await fetch(GAS_VENDOR_URL + '?action=getVendors');
    var data = await res.json();
    if (data.result === 'ok') {
      vendorDB = data.vendors || [];
    }
  } catch(e) {
    console.warn('거래처 로드 실패, 빌트인 목록 사용');
    vendorDB = [];
  }
}

// ── 거래처 검색 입력 ──
function onVendorInput(val) {
  val = val.trim();
  var dd = document.getElementById('vendorDropdown');

  if (!val) {
    dd.style.display = 'none';
    return;
  }

  // 검색 매칭
  var matched = vendorDB.filter(function(v) {
    var name = v['업체명'] || '';
    var alias = v['별칭'] || '';
    return name.toLowerCase().indexOf(val.toLowerCase()) >= 0
      || (alias && alias.toLowerCase().indexOf(val.toLowerCase()) >= 0)
      || matchChosong(name, val)
      || matchChosong(alias, val);
  }).slice(0, 12);

  if (!matched.length) {
    dd.style.display = 'none';
    return;
  }

  dd.innerHTML = '';
  matched.forEach(function(v) {
    var div = document.createElement('div');
    div.className = 'search-item';
    var name = v['업체명'] || '';
    var phone = v['전화번호'] || '';
    var addr  = v['위치'] || '';
    div.innerHTML =
      '<div class="search-item-name">' + highlight(name, val) + '</div>' +
      '<div class="search-item-meta">' + esc(phone) + (addr ? ' · ' + esc(addr) : '') + '</div>';
    div.addEventListener('click', function() {
      selectVendor(v);
    });
    dd.appendChild(div);
  });
  dd.style.display = 'block';
}

function highlight(text, keyword) {
  if (!keyword) return esc(text);
  var re = new RegExp('(' + escapeReg(keyword) + ')', 'gi');
  return esc(text).replace(re, '<strong style="color:var(--accent);">$1</strong>');
}

function closeDropdown() {
  document.getElementById('vendorDropdown').style.display = 'none';
}

// ── 거래처 선택 ──
function selectVendor(v) {
  selectedVendor = v;
  document.getElementById('vendorSearchInput').value = v['업체명'] || '';
  closeDropdown();

  // 거래처 정보 표시
  document.getElementById('viName').textContent = v['업체명'] || '';
  document.getElementById('viPhone').textContent = v['전화번호'] || '-';
  document.getElementById('viAddr').textContent  = v['위치'] || '-';
  document.getElementById('vendorInfoCard').classList.add('show');

  // 요청중 상품 로드
  loadRequestedItems(v['업체명']);
}

// ── 요청중 상품 로드 (캐시 우선, 없으면 fetch) ──
async function loadRequestedItems(vendorName) {
  document.getElementById('productPlaceholder').style.display = 'none';
  document.getElementById('productList').style.display = 'none';
  document.getElementById('addSection').style.display = 'none';
  document.getElementById('btnSelectAll').style.display = 'none';
  requestedItems = [];
  updateSaveBtn();

  // ✅ 캐시가 있으면 네트워크 없이 즉시 필터
  if (allSamplesCache !== null) {
    requestedItems = allSamplesCache
      .filter(function(r) {
        return r['거래처'] === vendorName && r['상태'] === '요청중';
      })
      .map(function(r) {
        return Object.assign({}, r, { selected: false });
      });
    renderProductList();
    document.getElementById('addSection').style.display = 'block';
    updateSaveBtn();
    return;
  }

  // ⏳ 캐시 없으면 로딩 표시 후 fetch (fallback)
  document.getElementById('productLoading').style.display = 'flex';
  try {
    var res = await fetch(GAS_SAMPLE_URL + '?action=getAll');
    var data = await res.json();
    if (data.result === 'ok') {
      allSamplesCache = data.rows || []; // 이번 기회에 캐시 저장
      requestedItems = allSamplesCache
        .filter(function(r) {
          return r['거래처'] === vendorName && r['상태'] === '요청중';
        })
        .map(function(r) {
          return Object.assign({}, r, { selected: false });
        });
    }
  } catch(e) {
    showToast('❌ 데이터 로드 실패');
  }
  document.getElementById('productLoading').style.display = 'none';
  renderProductList();
  document.getElementById('addSection').style.display = 'block';
  updateSaveBtn();
}

// ── 요청중 상품 렌더링 ──
function renderProductList() {
  var listEl = document.getElementById('productList');

  if (!requestedItems.length) {
    listEl.innerHTML = '<div class="empty-products">이 거래처의 요청중 상품이 없어요.<br>아래에서 직접 추가하세요.</div>';
    listEl.style.display = 'block';
    document.getElementById('btnSelectAll').style.display = 'none';
    return;
  }

  document.getElementById('btnSelectAll').style.display = 'inline-flex';

  var html = '';
  requestedItems.forEach(function(item, idx) {
    var isSelected = item.selected;
    html += '<div class="product-item' + (isSelected ? ' selected' : '') + '" onclick="toggleProduct(' + idx + ')" id="pitem-' + idx + '">';
    html += '<div class="product-check' + (isSelected ? ' on' : '') + '" id="pcheck-' + idx + '">' + (isSelected ? '✓' : '') + '</div>';
    html += '<div class="product-name">' + esc(item['상품명'] || '') + '</div>';
    if (item['출처']) html += '<div class="product-source">' + esc(item['출처']) + '</div>';
    html += '</div>';
  });

  listEl.innerHTML = html;
  listEl.style.display = 'block';
}

// ── 상품 체크 토글 ──
function toggleProduct(idx) {
  requestedItems[idx].selected = !requestedItems[idx].selected;
  var el = document.getElementById('pitem-' + idx);
  var chk = document.getElementById('pcheck-' + idx);
  if (requestedItems[idx].selected) {
    el.classList.add('selected');
    chk.classList.add('on'); chk.textContent = '✓';
  } else {
    el.classList.remove('selected');
    chk.classList.remove('on'); chk.textContent = '';
  }
  updateSaveBtn();
}

// ── 전체 선택 ──
function selectAll() {
  var anyUnselected = requestedItems.some(function(r) { return !r.selected; });
  requestedItems.forEach(function(r, idx) {
    r.selected = anyUnselected;
  });
  renderProductList();
  updateSaveBtn();
}

// ── 직접 추가 ──
function addManualItem() {
  var inp = document.getElementById('manualInput');
  var val = inp.value.trim();
  if (!val) return;
  manualItems.push(val);
  inp.value = '';
  renderManualList();
  updateSaveBtn();
}

function removeManualItem(idx) {
  manualItems.splice(idx, 1);
  renderManualList();
  updateSaveBtn();
}

function renderManualList() {
  var html = '';
  manualItems.forEach(function(name, idx) {
    html += '<div class="manual-item">';
    html += '<div class="manual-item-name">✏️ ' + esc(name) + '</div>';
    html += '<button class="btn-del-manual" onclick="removeManualItem(' + idx + ')">✕</button>';
    html += '</div>';
  });
  document.getElementById('manualList').innerHTML = html;
}

// ── 저장 버튼 상태 ──
function updateSaveBtn() {
  var hasVendor = !!selectedVendor;
  var selectedCount = requestedItems.filter(function(r) { return r.selected; }).length + manualItems.length;
  var btn = document.getElementById('btnSave');
  btn.disabled = !hasVendor || selectedCount === 0;
  if (hasVendor && selectedCount > 0) {
    btn.textContent = '📥 입고 처리 (' + selectedCount + '개)';
    btn.style.background = 'var(--green)';
  } else if (!hasVendor) {
    btn.textContent = '① 거래처를 먼저 선택하세요';
    btn.style.background = 'var(--gray-400)';
  } else {
    btn.textContent = '③ 상품을 선택하거나 추가하세요';
    btn.style.background = 'var(--gray-400)';
  }
}

// ── 입고 저장 ──
async function saveAll() {
  if (!selectedVendor) { showToast('거래처를 선택해주세요'); return; }

  var selectedRequested = requestedItems.filter(function(r) { return r.selected; });
  var totalCount = selectedRequested.length + manualItems.length;
  if (totalCount === 0) { showToast('상품을 선택하거나 추가해주세요'); return; }

  var inDate  = document.getElementById('inDate').value;
  var dueDate = document.getElementById('dueDate').value;
  if (!inDate || !dueDate) { showToast('날짜를 입력해주세요'); return; }

  var btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '처리 중...';

  var success = 0;
  var savedNames = [];

  // 1. 요청중 상품: 상태 업데이트 (보유중으로)
  for (var i = 0; i < selectedRequested.length; i++) {
    var item = selectedRequested[i];
    try {
      var payload = encodeURIComponent(JSON.stringify({
        '_row': item['_row'],
        '상태': '보유중',
        '입고일': inDate,
        '반납기한': dueDate
      }));
      var r1 = await fetch(GAS_SAMPLE_URL + '?action=updateStatus&data=' + payload);
      var j1 = await r1.json();
      if (j1.result === 'ok') { success++; savedNames.push(item['상품명'] || ''); }
      else { console.error('updateStatus 실패:', j1); }
    } catch(e) { console.error('updateStatus 오류:', e); }
  }

  // 2. 직접 추가 상품: 새 행으로 저장 (action=add)
  for (var j = 0; j < manualItems.length; j++) {
    var mName = manualItems[j];
    try {
      var newRow = {
        '상품명': mName,
        '거래처': selectedVendor['업체명'],
        '연락처': selectedVendor['전화번호'],
        '주소': selectedVendor['위치'],
        '입고일': inDate,
        '반납기한': dueDate,
        '상태': '보유중',
        '요청일': inDate,
        '출처': '수기입고',
        '비고': ''
      };
      var payload2 = encodeURIComponent(JSON.stringify(newRow));
      var r2 = await fetch(GAS_SAMPLE_URL + '?action=add&data=' + payload2);
      var j2 = await r2.json();
      if (j2.result === 'ok') { success++; savedNames.push(mName); }
      else { console.error('add 실패:', j2); }
    } catch(e) { console.error('add 오류:', e); }
  }

  // 결과 처리
  var failCount = (selectedRequested.length + manualItems.length) - success;
  if (failCount > 0) {
    showToast('⚠️ ' + failCount + '개 저장 실패 — 콘솔(F12) 확인');
  }
  if (success > 0) {
    // ✅ 캐시 업데이트: 입고 처리된 상품은 캐시에서도 '보유중'으로 변경
    // (다른 거래처 선택 시 목록에 안 뜨도록)
    if (allSamplesCache) {
      selectedRequested.forEach(function(item) {
        var cached = allSamplesCache.find(function(r) { return r['_row'] === item['_row']; });
        if (cached) {
          cached['상태'] = '보유중';
          cached['입고일'] = inDate;
          cached['반납기한'] = dueDate;
        }
      });
    }
    showSuccessPopup(selectedVendor['업체명'], savedNames, inDate, dueDate);
  }
  btn.disabled = false;
}

// ── 완료 팝업 ──
function showSuccessPopup(vendorName, names, inDate, dueDate) {
  document.getElementById('popupDesc').innerHTML =
    '<strong>' + esc(vendorName) + '</strong> · ' + names.length + '개 상품<br>' +
    '입고일 ' + inDate + ' · 반납기한 ' + dueDate;

  var itemHtml = '';
  names.forEach(function(n) {
    itemHtml += '<div class="popup-item">· ' + esc(n) + '</div>';
  });
  document.getElementById('popupItemList').innerHTML = itemHtml;
  document.getElementById('popupItems').style.display = 'block';
  document.getElementById('successPopup').classList.add('show');
}

function closePopup() {
  document.getElementById('successPopup').classList.remove('show');
  resetAll();
}

// ── 전체 초기화 ──
function resetAll() {
  selectedVendor = null;
  requestedItems = [];
  manualItems = [];
  document.getElementById('vendorSearchInput').value = '';
  document.getElementById('vendorInfoCard').classList.remove('show');
  document.getElementById('productPlaceholder').style.display = 'block';
  document.getElementById('productList').style.display = 'none';
  document.getElementById('productList').innerHTML = '';
  document.getElementById('addSection').style.display = 'none';
  document.getElementById('manualList').innerHTML = '';
  document.getElementById('btnSelectAll').style.display = 'none';
  setDefaultDates();
  updateSaveBtn();
}

// ── 유틸 ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// 초성 검색
var CHOSONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosong(str) {
  var result = '';
  for (var i = 0; i < str.length; i++) {
    var code = str.charCodeAt(i) - 0xAC00;
    if (code >= 0 && code <= 11171) {
      result += CHOSONG[Math.floor(code / 588)];
    } else {
      result += str[i];
    }
  }
  return result;
}
function matchChosong(target, keyword) {
  if (!keyword || !target) return false;
  var isChosong = keyword.split('').every(function(c) { return CHOSONG.indexOf(c) >= 0; });
  if (isChosong) return getChosong(target).indexOf(keyword) >= 0;
  return false;
}
function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// 바깥 클릭 시 드롭다운 닫기
document.addEventListener('click', function(e) {
  var inp = document.getElementById('vendorSearchInput');
  var dd  = document.getElementById('vendorDropdown');
  if (inp && !inp.contains(e.target) && dd && !dd.contains(e.target)) {
    dd.style.display = 'none';
  }
});
</script>
