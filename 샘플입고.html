<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>샘플 입고 | 더제이수</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
:root {
  --bg: #F7F6F3; --white: #FFF; --black: #111;
  --gray-100: #F2F1EE; --gray-200: #E6E3DE; --gray-400: #B0ADA7; --gray-600: #6B6760;
  --green: #2D6A4F; --green-light: #EAF4EE;
  --blue: #1A56A0; --blue-light: #EBF2FC;
  --red: #C0392B; --red-light: #FDECEA;
  --accent: #E8756A;
  --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,0.07); --font: 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font); background: var(--bg); color: var(--black); min-height: 100vh; padding-bottom: 120px; }

header { background: var(--black); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.logo { color: white; font-size: 16px; font-weight: 700; }
.logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; }
.btn-sheet-link { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 20px; text-decoration: none; border: none; cursor: pointer; font-family: var(--font); white-space: nowrap; }
.btn-reset-top { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); cursor: pointer; font-family: var(--font); }

.main { max-width: 680px; margin: 0 auto; padding: 20px 16px; width: 100%; }

.section { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.section-title { font-size: 13px; font-weight: 700; color: var(--gray-600); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.step-badge { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--black); color: white; font-size: 11px; font-weight: 700; flex-shrink: 0; }

/* 거래처 검색 */
.search-wrap { position: relative; }
.search-input { width: 100%; border: 1.5px solid var(--gray-200); border-radius: 10px; padding: 13px 16px; font-size: 15px; font-family: var(--font); background: var(--white); outline: none; transition: border-color 0.15s; }
.search-input:focus { border-color: var(--black); }
.search-dropdown { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: white; border: 1.5px solid var(--gray-200); border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.14); z-index: 300; max-height: 220px; overflow-y: auto; }
.search-item { padding: 11px 16px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--gray-100); }
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: var(--gray-100); }
.search-item-name { font-weight: 600; }
.search-item-meta { font-size: 11px; color: var(--gray-600); margin-top: 2px; }
.vendor-info-card { display: none; background: var(--blue-light); border: 1.5px solid #c0d8f0; border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.vendor-info-card.show { display: block; }
.vendor-info-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.vendor-info-row { font-size: 13px; color: #1A56A0; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.vendor-info-row:last-child { margin-bottom: 0; }

/* 날짜 */
.date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.date-field { display: flex; flex-direction: column; gap: 6px; }
.date-label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
.date-input { border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 11px 12px; font-size: 14px; font-family: var(--font); background: var(--white); outline: none; width: 100%; }
.date-input:focus { border-color: var(--black); }

/* 상품 추가 폼 */
.product-form { display: flex; flex-direction: column; gap: 10px; }
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
.form-input { border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 11px 13px; font-size: 14px; font-family: var(--font); background: var(--white); outline: none; width: 100%; }
.form-input:focus { border-color: var(--black); }

/* 혼용율 */
.material-wrap { display: flex; flex-direction: column; gap: 6px; }
.material-rows { display: flex; flex-direction: column; gap: 6px; }
.material-row { display: flex; align-items: center; gap: 6px; }
.material-name-input { flex: 1; border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: var(--font); background: var(--white); outline: none; }
.material-name-input:focus { border-color: var(--black); }
.material-pct-wrap { display: flex; align-items: center; gap: 4px; }
.material-pct-input { width: 64px; border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 9px 10px; font-size: 13px; font-family: var(--font); background: var(--white); outline: none; text-align: right; }
.material-pct-input:focus { border-color: var(--black); }
.pct-unit { font-size: 12px; color: var(--gray-600); }
.btn-del-material { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 16px; padding: 2px 4px; }
.btn-del-material:hover { color: var(--red); }
.btn-add-material { background: none; border: 1px dashed var(--gray-200); border-radius: 7px; padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--gray-600); cursor: pointer; font-family: var(--font); margin-top: 2px; width: 100%; text-align: left; }
.btn-add-material:hover { background: var(--gray-100); }
.material-preview { font-size: 11px; color: var(--blue); background: var(--blue-light); border-radius: 6px; padding: 5px 10px; margin-top: 2px; min-height: 24px; }

/* 칼라 */
.color-wrap { display: flex; flex-direction: column; gap: 8px; }
.color-presets { display: flex; flex-wrap: wrap; gap: 6px; }
.color-chip { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--gray-200); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); background: var(--white); transition: all 0.12s; color: var(--black); }
.color-chip:hover { border-color: var(--gray-400); }
.color-chip.selected { border-color: var(--black); background: var(--black); color: white; }
.color-input { border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: var(--font); background: var(--white); outline: none; width: 100%; }
.color-input:focus { border-color: var(--black); }

/* 사이즈 */
.size-btns { display: flex; gap: 8px; }
.size-btn { flex: 1; padding: 11px 0; border-radius: 8px; border: 1.5px solid var(--gray-200); font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font); background: var(--white); transition: all 0.12s; color: var(--black); }
.size-btn:hover { border-color: var(--gray-400); }
.size-btn.selected { border-color: var(--black); background: var(--black); color: white; }

/* 단가 */
.price-wrap { display: flex; align-items: center; gap: 6px; }
.price-input { flex: 1; border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 11px 13px; font-size: 14px; font-family: var(--font); background: var(--white); outline: none; }
.price-input:focus { border-color: var(--black); }
.price-unit { font-size: 13px; color: var(--gray-600); font-weight: 500; white-space: nowrap; }

/* 추가 버튼 */
.btn-add-product { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--black); color: white; font-size: 14px; font-weight: 700; font-family: var(--font); cursor: pointer; margin-top: 4px; }
.btn-add-product:hover { background: #333; }

/* 추가된 상품 목록 */
.added-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.added-item { border: 1.5px solid var(--green); background: var(--green-light); border-radius: 10px; padding: 11px 13px; display: flex; align-items: flex-start; gap: 10px; }
.added-item-info { flex: 1; }
.added-item-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.added-item-meta { font-size: 11px; color: var(--gray-600); line-height: 1.6; }
.btn-del-added { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 16px; padding: 2px; flex-shrink: 0; }
.btn-del-added:hover { color: var(--red); }

/* 힌트 */
.hint { font-size: 11px; color: var(--gray-400); margin-top: 6px; }

/* 저장 버튼 */
.save-wrap { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--gray-200); padding: 14px 16px; z-index: 50; }
.save-inner { max-width: 680px; margin: 0 auto; }
.btn-save { width: 100%; background: var(--green); color: white; border: none; border-radius: 10px; padding: 15px; font-size: 15px; font-weight: 700; font-family: var(--font); cursor: pointer; }
.btn-save:disabled { background: var(--gray-400) !important; cursor: not-allowed !important; }

/* 완료 팝업 */
.popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; align-items: center; justify-content: center; }
.popup-overlay.show { display: flex; }
.popup-box { background: white; border-radius: 20px; padding: 28px 24px; width: calc(100% - 40px); max-width: 380px; text-align: center; animation: popIn 0.3s ease; }
@keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.popup-icon { font-size: 48px; margin-bottom: 12px; }
.popup-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.popup-desc { font-size: 13px; color: var(--gray-600); margin-bottom: 20px; line-height: 1.6; }
.popup-items { background: var(--gray-100); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; text-align: left; max-height: 240px; overflow-y: auto; }
.popup-items-title { font-size: 11px; font-weight: 700; color: var(--gray-600); margin-bottom: 8px; }
.popup-item { font-size: 12px; color: var(--black); padding: 3px 0; border-bottom: 1px solid var(--gray-200); }
.popup-item:last-child { border-bottom: none; }
.btn-popup-close { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--green); color: white; font-size: 15px; font-weight: 700; font-family: var(--font); cursor: pointer; }

.spinner { width: 28px; height: 28px; border: 3px solid var(--gray-200); border-top-color: var(--black); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--black); color: white; padding: 10px 18px; border-radius: 24px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 400; max-width: calc(100vw - 40px); text-align: center; white-space: pre-line; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 480px) {
  .main { padding: 14px 12px; }
  input, select, button { touch-action: manipulation; }
  input[type="text"], input[type="date"], input[type="number"] { font-size: 16px !important; }
  .search-input { font-size: 16px !important; }
}
</style>
</head>
<body>

<header>
  <div class="logo">더제이수 <span>샘플입고</span></div>
  <div class="header-right">
    <a class="btn-sheet-link" href="https://docs.google.com/spreadsheets/d/1cSF19qDVRfIAdFMGOFMbD73yajki4zUdPoEFE0vemEY/edit#gid=0" target="_blank">📋 샘플관리 시트</a>
    <button class="btn-reset-top" onclick="resetAll()">↺ 초기화</button>
  </div>
</header>

<div class="main">

  <!-- STEP 1: 거래처 검색 -->
  <div class="section">
    <div class="section-title">
      <span class="step-badge">1</span>
      거래처 검색
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="vendorSearchInput"
        placeholder="🔍 거래처명 입력 (예: 이너프, ㅇㄴㅍ)"
        oninput="onVendorInput(this.value)"
        onkeydown="if(event.key==='Escape') closeDropdown()"
        autocomplete="off">
      <div class="search-dropdown" id="vendorDropdown"></div>
    </div>
    <div class="hint">초성 검색 지원 (예: ㄷㄹㅍ → 드라이플라워)</div>
    <div class="vendor-info-card" id="vendorInfoCard">
      <div class="vendor-info-name" id="viName"></div>
      <div class="vendor-info-row">📞 <span id="viPhone"></span></div>
      <div class="vendor-info-row">📍 <span id="viAddr"></span></div>
    </div>
  </div>

  <!-- STEP 2: 날짜 설정 -->
  <div class="section">
    <div class="section-title">
      <span class="step-badge">2</span>
      날짜 설정
    </div>
    <div class="date-row">
      <div class="date-field">
        <div class="date-label">📥 입고일</div>
        <input type="date" class="date-input" id="inDate">
      </div>
      <div class="date-field">
        <div class="date-label">📤 반납기한</div>
        <input type="date" class="date-input" id="dueDate">
      </div>
    </div>
  </div>

  <!-- STEP 3: 상품 추가 -->
  <div class="section">
    <div class="section-title">
      <span class="step-badge">3</span>
      상품 추가
    </div>
    <div class="product-form">
      <!-- 거래처 상품명 -->
      <div class="form-row">
        <div class="form-label">거래처 상품명 <span style="color:var(--accent)">*</span></div>
        <input type="text" class="form-input" id="inputName" placeholder="예: 울 오버핏 코트">
      </div>

      <!-- 혼용율 -->
      <div class="form-row">
        <div class="form-label">혼용율</div>
        <div class="material-wrap">
          <div class="material-rows" id="materialRows">
            <div class="material-row" data-idx="0">
              <input type="text" class="material-name-input" placeholder="소재명 (예: 울)" oninput="updateMaterialPreview()">
              <div class="material-pct-wrap">
                <input type="number" class="material-pct-input" placeholder="0" min="0" max="100" oninput="updateMaterialPreview()">
                <span class="pct-unit">%</span>
              </div>
              <button class="btn-del-material" onclick="delMaterialRow(this)" title="삭제">✕</button>
            </div>
          </div>
          <button class="btn-add-material" onclick="addMaterialRow()">+ 소재 추가</button>
          <div class="material-preview" id="materialPreview">-</div>
        </div>
        <div class="hint">소재명은 약어 자동 변환 (울·나이→나일론·폴리→폴리에스터 등)</div>
      </div>

      <!-- 칼라 -->
      <div class="form-row">
        <div class="form-label">칼라</div>
        <div class="color-wrap">
          <div class="color-presets" id="colorPresets">
            <!-- JS로 렌더링 -->
          </div>
          <input type="text" class="color-input" id="colorInput" placeholder="직접 입력 또는 위에서 선택" oninput="onColorInput(this.value)">
        </div>
      </div>

      <!-- 사이즈 -->
      <div class="form-row">
        <div class="form-label">사이즈</div>
        <div class="size-btns">
          <button class="size-btn" data-size="S" onclick="toggleSize(this)">S</button>
          <button class="size-btn" data-size="M" onclick="toggleSize(this)">M</button>
          <button class="size-btn" data-size="L" onclick="toggleSize(this)">L</button>
          <button class="size-btn" data-size="Free" onclick="toggleSize(this)">Free</button>
        </div>
        <input type="text" class="form-input" id="sizeInput" placeholder="직접 입력 (예: XL, 55, 44-66)" style="margin-top:8px;" oninput="onSizeInput(this.value)">
      </div>

      <!-- 단가 -->
      <div class="form-row">
        <div class="form-label">단가</div>
        <div class="price-wrap">
          <input type="number" class="price-input" id="priceInput" placeholder="0" min="0">
          <span class="price-unit">원</span>
        </div>
      </div>

      <button class="btn-add-product" onclick="addProduct()">+ 목록에 추가</button>
    </div>

    <!-- 추가된 상품 목록 -->
    <div class="added-list" id="addedList"></div>
  </div>

</div>

<!-- 저장 버튼 -->
<div class="save-wrap">
  <div class="save-inner">
    <button class="btn-save" id="btnSave" onclick="saveAll()" disabled>
      📥 입고 처리
    </button>
  </div>
</div>

<!-- 완료 팝업 -->
<div class="popup-overlay" id="successPopup">
  <div class="popup-box">
    <div class="popup-icon">🎉</div>
    <div class="popup-title">입고 완료!</div>
    <div class="popup-desc" id="popupDesc"></div>
    <div class="popup-items" id="popupItems" style="display:none;">
      <div class="popup-items-title">입고된 상품</div>
      <div id="popupItemList"></div>
    </div>
    <button class="btn-popup-close" onclick="closePopup()">확인</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var GAS_VENDOR_URL  = 'https://script.google.com/macros/s/AKfycbyDdnhYVgXfr0MTOj0l_kKm6l7cQ061k6cHqtNPauhF7gYuKJWVFRcCQHij3c297b8O/exec';
var GAS_SAMPLE_URL  = 'https://script.google.com/macros/s/AKfycbwfelSlPiN9AwwD5aID2ypYYjLh9B6lb2TpXHj6qXYIgNqEivojUicTGn7WzMwCChLGEQ/exec';

var vendorDB = [];
var selectedVendor = null;
var addedProducts = [];   // 이번 입고에 추가된 상품 목록
var selectedSize = '';    // 선택된 사이즈
var selectedColor = '';   // 선택된 칼라

// ── 색상 프리셋 ──
var COLOR_PRESETS = [
  { label: '블랙', value: '블랙' },
  { label: '화이트', value: '화이트' },
  { label: '아이보리', value: '아이보리' },
  { label: '베이지', value: '베이지' },
  { label: '그레이', value: '그레이' },
  { label: '네이비', value: '네이비' },
  { label: '브라운', value: '브라운' },
  { label: '카키', value: '카키' },
  { label: '버건디', value: '버건디' },
  { label: '블루', value: '블루' },
  { label: '핑크', value: '핑크' },
  { label: '레드', value: '레드' },
];

// ── 색상 약어 맵 (입력 → 정식명) ──
var COLOR_ALIAS = {
  '아이': '아이보리', '아이보': '아이보리', 'ivory': '아이보리',
  '검정': '블랙', '검': '블랙', 'black': '블랙', 'bk': '블랙',
  '흰': '화이트', '흰색': '화이트', 'white': '화이트', 'wh': '화이트',
  '베': '베이지', 'beige': '베이지',
  '회색': '그레이', '그레': '그레이', 'gray': '그레이', 'grey': '그레이',
  '남': '네이비', '남색': '네이비', 'navy': '네이비', 'nv': '네이비',
  '갈색': '브라운', 'brown': '브라운',
  '카': '카키', 'khaki': '카키',
  '버건': '버건디', '와인': '버건디', 'burgundy': '버건디', 'wine': '버건디',
  '파란': '블루', '파랑': '블루', '파': '블루', 'blue': '블루',
  '분홍': '핑크', '핑': '핑크', 'pink': '핑크',
  '빨강': '레드', '빨': '레드', 'red': '레드',
  '연두': '라임', 'lime': '라임',
  '노랑': '옐로우', '노란': '옐로우', 'yellow': '옐로우',
  '보라': '퍼플', 'purple': '퍼플', '자주': '퍼플',
  '민트': '민트', 'mint': '민트',
  '코랄': '코랄', 'coral': '코랄',
  '오렌지': '오렌지', 'orange': '오렌지',
};

// ── 소재 약어 맵 ──
var MATERIAL_ALIAS = {
  '울': '울', '울100': '울', 'wool': '울',
  '나이': '나일론', '나이론': '나일론', '나일': '나일론', 'nylon': '나일론', 'ny': '나일론',
  '폴리': '폴리에스터', '폴리에': '폴리에스터', 'poly': '폴리에스터', 'polyester': '폴리에스터', 'pe': '폴리에스터',
  '아크': '아크릴', '아크릴': '아크릴', 'acrylic': '아크릴',
  '코튼': '면', '면': '면', 'cotton': '면', 'ct': '면',
  '린넨': '린넨', 'linen': '린넨',
  '비스': '비스코스', '비스코스': '비스코스', 'viscose': '비스코스',
  '레이온': '레이온', 'rayon': '레이온',
  '텐셀': '텐셀', 'tencel': '텐셀', 'lyocell': '라이오셀',
  '모달': '모달', 'modal': '모달',
  '캐시': '캐시미어', '캐시미어': '캐시미어', 'cashmere': '캐시미어',
  '앙고라': '앙고라', 'angora': '앙고라',
  '스판': '스판덱스', '스판덱스': '스판덱스', 'spandex': '스판덱스', 'elastane': '스판덱스',
  '실크': '실크', 'silk': '실크',
  '가죽': '가죽', '피혁': '가죽', 'leather': '가죽',
  '폴리우레탄': '폴리우레탄', 'pu': '폴리우레탄', 'polyurethane': '폴리우레탄',
};

function normalizeMaterial(raw) {
  var s = raw.trim().toLowerCase();
  for (var k in MATERIAL_ALIAS) {
    if (s === k.toLowerCase()) return MATERIAL_ALIAS[k];
  }
  return raw.trim();
}

function normalizeColor(raw) {
  var s = raw.trim().toLowerCase();
  for (var k in COLOR_ALIAS) {
    if (s === k.toLowerCase()) return COLOR_ALIAS[k];
  }
  return raw.trim();
}

// ── 초기화 ──
window.addEventListener('load', function() {
  setDefaultDates();
  loadVendors();
  renderColorPresets();
});

function setDefaultDates() {
  var today = new Date();
  var due = new Date(today);
  due.setDate(due.getDate() + 14);
  document.getElementById('inDate').value  = formatDate(today);
  document.getElementById('dueDate').value = formatDate(due);
}

function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ── 거래처 로드 ──
async function loadVendors() {
  try {
    var res = await fetch(GAS_VENDOR_URL + '?action=getVendors');
    var data = await res.json();
    if (data.result === 'ok') vendorDB = data.vendors || [];
  } catch(e) {}
}

// ── 거래처 검색 ──
function onVendorInput(val) {
  val = val.trim();
  var dd = document.getElementById('vendorDropdown');
  if (!val) { dd.style.display = 'none'; return; }

  var matched = vendorDB.filter(function(v) {
    var name = v['업체명'] || '';
    var alias = v['별칭'] || '';
    return name.toLowerCase().indexOf(val.toLowerCase()) >= 0
      || (alias && alias.toLowerCase().indexOf(val.toLowerCase()) >= 0)
      || matchChosong(name, val)
      || matchChosong(alias, val);
  }).slice(0, 12);

  if (!matched.length) { dd.style.display = 'none'; return; }

  dd.innerHTML = '';
  matched.forEach(function(v) {
    var div = document.createElement('div');
    div.className = 'search-item';
    div.innerHTML =
      '<div class="search-item-name">' + highlight(v['업체명']||'', val) + '</div>' +
      '<div class="search-item-meta">' + esc(v['전화번호']||'') + (v['위치'] ? ' · ' + esc(v['위치']) : '') + '</div>';
    div.addEventListener('click', function() { selectVendor(v); });
    dd.appendChild(div);
  });
  dd.style.display = 'block';
}

function closeDropdown() { document.getElementById('vendorDropdown').style.display = 'none'; }

function selectVendor(v) {
  selectedVendor = v;
  document.getElementById('vendorSearchInput').value = v['업체명'] || '';
  closeDropdown();
  document.getElementById('viName').textContent   = v['업체명'] || '';
  document.getElementById('viPhone').textContent  = v['전화번호'] || '-';
  document.getElementById('viAddr').textContent   = v['위치'] || '-';
  document.getElementById('vendorInfoCard').classList.add('show');
  updateSaveBtn();
}

// ── 색상 프리셋 렌더링 ──
function renderColorPresets() {
  var wrap = document.getElementById('colorPresets');
  wrap.innerHTML = '';
  COLOR_PRESETS.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className = 'color-chip';
    btn.textContent = c.label;
    btn.dataset.value = c.value;
    btn.onclick = function() {
      document.querySelectorAll('.color-chip').forEach(function(el) { el.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedColor = c.value;
      document.getElementById('colorInput').value = c.value;
    };
    wrap.appendChild(btn);
  });
}

function onColorInput(val) {
  var normalized = normalizeColor(val);
  selectedColor = normalized;
  document.querySelectorAll('.color-chip').forEach(function(el) {
    el.classList.toggle('selected', el.dataset.value === normalized);
  });
}

// ── 사이즈 ──
// selectedSize → 배열로 변경
var selectedSizes = [];

function toggleSize(btn) {
  var size = btn.dataset.size;
  var idx = selectedSizes.indexOf(size);
  if (idx >= 0) {
    selectedSizes.splice(idx, 1);
    btn.classList.remove('selected');
  } else {
    selectedSizes.push(size);
    btn.classList.add('selected');
  }
  // 버튼 선택 시 직접입력 초기화
  document.getElementById('sizeInput').value = '';
  selectedSize = selectedSizes.join(', ');
}
function onSizeInput(val) {
  selectedSize = val.trim();
  // 직접입력 시 버튼 선택 해제
  selectedSizes = [];
  document.querySelectorAll('.size-btn').forEach(function(el) { el.classList.remove('selected'); });
}

// ── 혼용율 ──
function addMaterialRow() {
  var rows = document.getElementById('materialRows');
  var idx = rows.children.length;
  var div = document.createElement('div');
  div.className = 'material-row';
  div.dataset.idx = idx;
  div.innerHTML =
    '<input type="text" class="material-name-input" placeholder="소재명 (예: 폴리)" oninput="updateMaterialPreview()">' +
    '<div class="material-pct-wrap">' +
      '<input type="number" class="material-pct-input" placeholder="0" min="0" max="100" oninput="updateMaterialPreview()">' +
      '<span class="pct-unit">%</span>' +
    '</div>' +
    '<button class="btn-del-material" onclick="delMaterialRow(this)" title="삭제">✕</button>';
  rows.appendChild(div);
}

function delMaterialRow(btn) {
  var row = btn.closest('.material-row');
  var rows = document.getElementById('materialRows');
  if (rows.children.length <= 1) {
    row.querySelectorAll('input').forEach(function(el) { el.value = ''; });
  } else {
    row.remove();
  }
  updateMaterialPreview();
}

function updateMaterialPreview() {
  var rows = document.getElementById('materialRows').querySelectorAll('.material-row');
  var parts = [];
  rows.forEach(function(row) {
    var nameEl = row.querySelector('.material-name-input');
    var pctEl  = row.querySelector('.material-pct-input');
    if (!nameEl || !pctEl) return;
    var name = nameEl.value.trim();
    var pct  = pctEl.value.trim();
    if (name && pct) {
      parts.push(normalizeMaterial(name) + ' ' + pct + '%');
    }
  });
  var preview = document.getElementById('materialPreview');
  preview.textContent = parts.length ? parts.join(' ') : '-';
}

function getMaterialString() {
  var rows = document.getElementById('materialRows').querySelectorAll('.material-row');
  var parts = [];
  rows.forEach(function(row) {
    var nameEl = row.querySelector('.material-name-input');
    var pctEl  = row.querySelector('.material-pct-input');
    if (!nameEl || !pctEl) return;
    var name = nameEl.value.trim();
    var pct  = pctEl.value.trim();
    if (name && pct) {
      parts.push(normalizeMaterial(name) + ' ' + pct + '%');
    }
  });
  return parts.join(' ');
}

// ── 상품 추가 ──
function addProduct() {
  var name = document.getElementById('inputName').value.trim();
  if (!name) { showToast('상품명을 입력해주세요'); return; }

  var material = getMaterialString();
  var color    = normalizeColor(document.getElementById('colorInput').value.trim());
  var size     = selectedSize;
  var price    = document.getElementById('priceInput').value.trim();

  addedProducts.push({ name: name, material: material, color: color, size: size, price: price });
  renderAddedList();
  clearProductForm();
  updateSaveBtn();
}

function clearProductForm() {
  document.getElementById('inputName').value = '';
  // 혼용율 초기화
  var rows = document.getElementById('materialRows');
  rows.innerHTML = '';
  addMaterialRowEl(rows);
  updateMaterialPreview();
  // 칼라 초기화
  document.getElementById('colorInput').value = '';
  document.querySelectorAll('.color-chip').forEach(function(el) { el.classList.remove('selected'); });
  selectedColor = '';
  // 사이즈 초기화
  selectedSize = '';
  selectedSizes = [];
  document.querySelectorAll('.size-btn').forEach(function(el) { el.classList.remove('selected'); });
  document.getElementById('sizeInput').value = '';
  // 단가 초기화
  document.getElementById('priceInput').value = '';
}

function addMaterialRowEl(container) {
  var div = document.createElement('div');
  div.className = 'material-row';
  div.innerHTML =
    '<input type="text" class="material-name-input" placeholder="소재명 (예: 울)" oninput="updateMaterialPreview()">' +
    '<div class="material-pct-wrap">' +
      '<input type="number" class="material-pct-input" placeholder="0" min="0" max="100" oninput="updateMaterialPreview()">' +
      '<span class="pct-unit">%</span>' +
    '</div>' +
    '<button class="btn-del-material" onclick="delMaterialRow(this)" title="삭제">✕</button>';
  container.appendChild(div);
}

function renderAddedList() {
  var html = '';
  addedProducts.forEach(function(p, i) {
    var meta = [];
    if (p.material) meta.push('혼용율: ' + p.material);
    if (p.color)    meta.push('칼라: ' + p.color);
    if (p.size)     meta.push('사이즈: ' + p.size);
    if (p.price)    meta.push('단가: ' + Number(p.price).toLocaleString() + '원');

    html += '<div class="added-item">' +
      '<div class="added-item-info">' +
        '<div class="added-item-name">' + esc(p.name) + '</div>' +
        (meta.length ? '<div class="added-item-meta">' + esc(meta.join(' · ')) + '</div>' : '') +
      '</div>' +
      '<button class="btn-del-added" onclick="removeProduct(' + i + ')">✕</button>' +
      '</div>';
  });
  document.getElementById('addedList').innerHTML = html;
}

function removeProduct(i) {
  addedProducts.splice(i, 1);
  renderAddedList();
  updateSaveBtn();
}

// ── 저장 버튼 상태 ──
function updateSaveBtn() {
  var btn = document.getElementById('btnSave');
  var ok = selectedVendor && addedProducts.length > 0;
  btn.disabled = !ok;
  if (!selectedVendor) {
    btn.textContent = '① 거래처를 먼저 선택하세요';
  } else if (addedProducts.length === 0) {
    btn.textContent = '③ 상품을 추가하세요';
  } else {
    btn.textContent = '📥 입고 처리 (' + addedProducts.length + '개)';
  }
}

// ── 입고 저장 ──
async function saveAll() {
  if (!selectedVendor) { showToast('거래처를 선택해주세요'); return; }
  if (!addedProducts.length) { showToast('상품을 추가해주세요'); return; }

  var inDate  = document.getElementById('inDate').value;
  var dueDate = document.getElementById('dueDate').value;
  if (!inDate || !dueDate) { showToast('날짜를 입력해주세요'); return; }

  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '처리 중...';

  var success = 0;
  var savedNames = [];

  for (var i = 0; i < addedProducts.length; i++) {
    var p = addedProducts[i];
    try {
      var newRow = {
        '상품명': p.name,
        '거래처': selectedVendor['업체명'],
        '연락처': selectedVendor['전화번호'] || '',
        '주소': selectedVendor['위치'] || '',
        '입고일': inDate,
        '반납기한': dueDate,
        '상태': '보유중',
        '요청일': inDate,
        '출처': '수기입고',
        '혼용율': p.material || '',
        '칼라': p.color || '',
        '사이즈': p.size || '',
        '단가': p.price || '',
        '비고': ''
      };
      var payload = encodeURIComponent(JSON.stringify(newRow));
      var res = await fetch(GAS_SAMPLE_URL + '?action=add&data=' + payload);
      var data = await res.json();
      if (data.result === 'ok') { success++; savedNames.push(p.name); }
    } catch(e) {}
  }

  var failCount = addedProducts.length - success;
  if (success > 0) {
    showSuccessPopup(selectedVendor['업체명'], savedNames, inDate, dueDate, failCount);
  } else {
    showToast('❌ 저장 실패. 네트워크를 확인해주세요');
    btn.disabled = false;
    updateSaveBtn();
  }
}

// ── 완료 팝업 ──
function showSuccessPopup(vendorName, names, inDate, dueDate, failCount) {
  document.getElementById('popupDesc').innerHTML =
    '<strong>' + esc(vendorName) + '</strong> · ' + names.length + '개 상품<br>' +
    '입고일 ' + inDate + ' · 반납기한 ' + dueDate +
    (failCount > 0 ? '<br><span style="color:var(--red)">⚠ ' + failCount + '개 저장 실패</span>' : '');

  var itemHtml = '';
  names.forEach(function(n) {
    itemHtml += '<div class="popup-item">· ' + esc(n) + '</div>';
  });
  document.getElementById('popupItemList').innerHTML = itemHtml;
  document.getElementById('popupItems').style.display = 'block';
  document.getElementById('successPopup').classList.add('show');
}

function closePopup() {
  document.getElementById('successPopup').classList.remove('show');
  resetAll();
}

// ── 전체 초기화 ──
function resetAll() {
  selectedVendor = null;
  addedProducts = [];
  selectedSize = '';
  selectedColor = '';
  document.getElementById('vendorSearchInput').value = '';
  document.getElementById('vendorInfoCard').classList.remove('show');
  clearProductForm();
  document.getElementById('addedList').innerHTML = '';
  setDefaultDates();
  updateSaveBtn();
}

// ── 유틸 ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(text, keyword) {
  if (!keyword) return esc(text);
  var re = new RegExp('(' + escapeReg(keyword) + ')', 'gi');
  return esc(text).replace(re, '<strong style="color:var(--accent);">$1</strong>');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

var CHOSONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosong(str) {
  var result = '';
  for (var i = 0; i < str.length; i++) {
    var code = str.charCodeAt(i) - 0xAC00;
    result += (code >= 0 && code <= 11171) ? CHOSONG[Math.floor(code / 588)] : str[i];
  }
  return result;
}
function matchChosong(target, keyword) {
  if (!keyword || !target) return false;
  var isChosong = keyword.split('').every(function(c) { return CHOSONG.indexOf(c) >= 0; });
  return isChosong ? getChosong(target).indexOf(keyword) >= 0 : false;
}
function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

document.addEventListener('click', function(e) {
  var inp = document.getElementById('vendorSearchInput');
  var dd  = document.getElementById('vendorDropdown');
  if (inp && !inp.contains(e.target) && dd && !dd.contains(e.target)) dd.style.display = 'none';
});
</script>
